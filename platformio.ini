; CanTick — remote CAN node firmware
; Seeed XIAO + Seeed XIAO CAN Bus Expansion Board (MCP2515, 16 MHz, CS = D7)
; Open this folder (CanTick/) as its own PlatformIO workspace on the Mac.
;
; Two board variants are in service. Select one with -e s3 or -e c6.
; The native environment is the host test build. It compiles no firmware
; source, thus it needs no board.

[platformio]
; A bare `pio run` builds the two board variants only. It skips native,
; because native has no firmware to build.
default_envs = s3, c6

; ── Shared ESP32 settings ────────────────────────────────────────────────────
; The pin map stays in include/config.h in XIAO pad names (D7, D0). Each board
; variant resolves a pad name to its own GPIO number, thus one pin map serves
; both variants with no preprocessor switch.
[esp32_common]
platform  = espressif32
framework = arduino

monitor_speed = 115200
; upload/monitor use the native USB-C port
upload_protocol = esptool

build_flags =
    ; Route Serial to the native USB CDC (TinyUSB) — this is the provisioning
    ; channel the Pi talks to, and the VID that kilodash detects (0x303A).
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=2

lib_deps =
    ; MCP2515 driver with explicit clock select (needed for the 16 MHz xtal)
    coryjfowler/mcp_can @ ^1.5.1
    ; WS2812B front panel on D0 (DISPLAY.md §1)
    adafruit/Adafruit NeoPixel @ ^1.12.0

; Every test in this project is a host test. This line stops a bare `pio test`
; from a flash of a board that nobody asked for.
test_ignore = *

; WiFi, WiFiUdp, ESPmDNS, Preferences (NVS) all ship with the ESP32 Arduino core.

; ── Board variants ───────────────────────────────────────────────────────────
; CANTICK_STATUS_ON_MATRIX picks the status output. The S3 has an onboard LED.
; The C6 has none usable, thus the matrix carries the status pixel. The flag is
; per environment and visible, not a switch hidden in a source file.
[env:s3]
extends = esp32_common
board    = seeed_xiao_esp32s3
build_flags =
    ${esp32_common.build_flags}
    -D CANTICK_STATUS_ON_MATRIX=0

[env:c6]
extends = esp32_common
board    = seeed_xiao_esp32c6
; The default table reserves a second OTA slot that this firmware never uses.
; Provisioning is USB CDC, and PROTOCOL.md has no OTA path. huge_app.csv gives
; that space back to the app slot, which the display code needs.
board_build.partitions = huge_app.csv
build_flags =
    ${esp32_common.build_flags}
    -D CANTICK_STATUS_ON_MATRIX=1

; ── Bench build ──────────────────────────────────────────────────────────────
; Panel simulation for a bench with no CAN source. It renders the locked idle
; layout and feeds it with synthetic counts, holding 10, 40, 80, 97, 92 then
; 40 % load for 20 s each. It never calls canlink::send(), thus it puts nothing
; on the bus. default_envs does not name it, thus a bare `pio run` never builds
; it and no shipping image carries the flag.
;
; CANTICK_BENCH_BRIGHTNESS overrides the cap for the bench only. DISPLAY.md §3
; rule 13 still reads 32, and no shipping environment defines the override.
[env:s3_demo]
extends = env:s3
build_flags =
    ${env:s3.build_flags}
    -D CANTICK_PANEL_DEMO=1
    -D CANTICK_BENCH_BRIGHTNESS=20

; Video build. The locked design only: no variants, no logging, no WiFi. It runs
; a 28.5 s loop that tells the whole story, thus any 15 s clip reads. The boot
; splash runs once, then the loop repeats: the bus-speed card, light traffic in
; that color, a build to saturation, and a fall back to quiet. Teeth included.
; CANTICK_VIDEO_BITRATE overrides the displayed bus speed for the camera only.
; It never reaches NVS, and canlink still comes up on the board's stored speed.
[env:s3_video]
extends = env:s3_demo
build_flags =
    ${env:s3_demo.build_flags}
    -D CANTICK_PANEL_VIDEO=1
    -D CANTICK_VIDEO_BITRATE=100000UL

; ── Host tests ───────────────────────────────────────────────────────────────
; Run with: ~/.platformio/penv/bin/pio test -e native
; build_src_filter is an allowlist. Only a pure unit goes in it, thus no Arduino
; source reaches the host compiler. Add a file here when it has no I/O.
[env:native]
platform       = native
test_framework = unity
build_flags    = -std=c++17

test_build_src   = yes
build_src_filter = -<*> +<matrix.cpp> +<bus_load.cpp> +<cards.cpp> +<strips.cpp> +<panel.cpp>
